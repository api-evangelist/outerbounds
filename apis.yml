name: Outerbounds
description: >-
  Outerbounds is a fully managed platform for building and deploying production-grade
  AI, ML, and data systems, built on the open-source Metaflow framework originally
  developed at Netflix. It brings data, models, and agents together with software
  discipline: scalable, cost-efficient compute integrated with a customer's existing
  cloud and data platforms, GPU access and autoscaling, consistent offline/online
  runtimes, and enterprise controls including SOC 2 and HIPAA. The developer surface
  is the Metaflow Python SDK and the outerbounds configuration CLI rather than a public
  REST API. Outerbounds is joining Anaconda.
